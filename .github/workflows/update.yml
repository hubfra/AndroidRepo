name: Aktualizacja statystyk

on:
  schedule:
    # Codziennie 4:15 UTC (5:15 zimą / 6:15 latem czasu polskiego).
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Dzień w formacie RRRR-MM-DD (puste = dziś)"
        required: false
        default: ""
      source:
        description: "Źródło danych"
        type: choice
        options:
          - api-football
          - espn (darmowe, ze spalonymi)
          - football-data (darmowe, bez spalonych)
        default: api-football
      demo:
        description: "Tryb demo: zmyślone dane testowe, bez API"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Przywróć zapisane dane z API
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: Testy
        run: python -m unittest discover -s tests -v

      - name: Pobierz dane i zbuduj zestawienie
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MAX_REQUESTS: ${{ vars.MAX_REQUESTS || '90' }}
          REQUEST_DELAY: ${{ vars.REQUEST_DELAY || '6.5' }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DEMO: ${{ inputs.demo }}
          INPUT_SOURCE: ${{ inputs.source || vars.DATA_SOURCE || 'api-football' }}
        run: |
          args=()
          [ -n "$INPUT_DATE" ] && args+=(--date "$INPUT_DATE")
          if [ "$INPUT_DEMO" = "true" ]; then
            python scripts/fetch_data.py "${args[@]}" --mock
          elif [[ "$INPUT_SOURCE" == espn* ]]; then
            python scripts/fetch_espn.py "${args[@]}"
          elif [[ "$INPUT_SOURCE" == football-data* ]]; then
            python scripts/fetch_fdcouk.py "${args[@]}"
          else
            python scripts/fetch_data.py "${args[@]}"
          fi

      - name: Zapisz dane z API na kolejne dni
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: api-cache-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
